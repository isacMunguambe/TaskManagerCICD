name: TaskManager CD

# QUANDO corre: só em push para master (ou à mão). NUNCA em Pull Requests:
# o job de deploy corre na tua máquina e o repositório é público
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# Nunca cancelar um deployment a meio; os seguintes esperam na fila
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Job 1: chama o ci.yaml (formatação, build, testes e criação do pacote taskmanager-api)
  # É o mesmo CI dos Pull Requests: um único sítio onde o build e os testes estão definidos
  ci:
    uses: ./.github/workflows/ci.yaml

  # Job 2: na TUA máquina (runner self-hosted). Só começa se o ci passou
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/master'   # mesmo com "Run workflow", só publica a partir do master
    runs-on: [self-hosted, windows, iis]

    steps:
      # Só precisa da pasta scripts, para ter o deploy.ps1
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      # Descarrega o pacote que o ci.yaml publicou
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: taskmanager-api
          path: ./publish

      - name: Deploy to IIS
        shell: powershell
        run: ./scripts/deploy.ps1 -Source "$PWD\publish"
