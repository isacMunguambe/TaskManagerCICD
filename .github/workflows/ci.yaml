name: TaskManager CI

on:
  push:
    branches: [ main, develop ]

  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TaskManagerCICD.sln

      - name: Build application
        run: dotnet build TaskManagerCICD.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test TaskManagerCICD.sln --no-build --configuration Release
